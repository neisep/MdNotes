name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test -c Release

  linux:
    needs: [test]
    runs-on: ubuntu-latest
    # Native AOT links against the build machine's glibc, so an older base image is what lets the
    # binary run on older distros. See .github/scripts/build-linux-aot.sh.
    container: ubuntu:22.04
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            clang zlib1g-dev binutils libicu70 ca-certificates curl git

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (Native AOT)
        run: bash .github/scripts/build-linux-aot.sh out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdnotes-linux-x64
          path: out/mdnotes-linux-x86_64.tar.gz

  windows:
    needs: [test]
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          # The single-file build stays the main Windows download until AOT has been tried on Windows.
          - variant: single-file
            publish: --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          - variant: aot
            publish: -p:PublishAot=true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (${{ matrix.variant }})
        run: dotnet publish MdNotes -c Release -r win-x64 ${{ matrix.publish }} -o out

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          if ('${{ matrix.variant }}' -eq 'aot') {
            # The executable plus the native DLLs it loads; the .pdb symbols stay out of the download.
            New-Item -ItemType Directory -Force mdnotes-windows-x86_64 | Out-Null
            Get-ChildItem out -Include *.exe, *.dll -Recurse | Copy-Item -Destination mdnotes-windows-x86_64
            Compress-Archive mdnotes-windows-x86_64 release/mdnotes-windows-x86_64-aot.zip
          } else {
            Copy-Item out/MdNotes.exe release/mdnotes-windows-x86_64.exe
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdnotes-win-x64-${{ matrix.variant }}
          path: release/*

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags for the changelog

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate changelog
        run: bash .github/scripts/changelog.sh "${{ github.ref_name }}" > notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file notes.md \
            artifacts/mdnotes-linux-x86_64.tar.gz \
            artifacts/mdnotes-windows-x86_64.exe \
            artifacts/mdnotes-windows-x86_64-aot.zip
